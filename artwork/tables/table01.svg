   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="14.838583" y="43.698521" transform="rotate(-0 14.838583 43.698521)">Research line</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="99.877953" y="43.002896" transform="rotate(-0 99.877953 43.002896)">Main object addressed</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="292.633858" y="43.048833" transform="rotate(-0 292.633858 43.048833)">Relation to the present method</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 64.536567)">Active feature acquisition</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 73.372905)">[12–16]</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(99.877953 64.452896)">Predictive utility and observation cost under subset</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(99.877953 74.017124)">observations</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 64.495552)">May supply a feature schedule; does not substitute for checking the</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 74.05978)">stated relative-loss certificate</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 95.352896)">Risk-controlled early exit</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 104.262515)">[5]</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(99.877953 95.436567)">Calibrated distributional risk or a final-model performance</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(99.877953 103.572358)">gap</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 95.395552)">Establishes the relative Brier target; the quantifier here is individual</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 104.221499)">input and every label</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 126.295552)">Certified lazy</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 135.85978)">boosted-tree inference</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 144.041509)">[6]</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="99.877953" y="126.295552" transform="rotate(-0 99.877953 126.295552)">Preservation of the complete winning class</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="292.633858" y="126.295552" transform="rotate(-0 292.633858 126.295552)">Supplies a distinct output criterion, tested by score separation</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 166.602896)">Adversarial uncertainty</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 175.555171)">certification [7]</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="99.877953" y="166.643911" transform="rotate(-0 99.877953 166.643911)">Worst calibration quantities over a perturbation set</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="292.633858" y="166.645552" transform="rotate(-0 292.633858 166.645552)">Related certification tools with a different domain and loss object</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="14.838583" y="198.198521" transform="rotate(-0 14.838583 198.198521)">Present construction</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(99.877953 197.586567)">Worst relative multiclass half-Brier loss over complete</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(99.877953 206.412515)">outputs consistent with observed blocks</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 197.545552)">Constructs and certifies a probability vector, while charging its full</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 206.371499)">processing cost</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.5px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="11.338583" y="230.999441" transform="rotate(-0 11.338583 230.999441)">The present objective is pointwise relative multiclass half-Brier fidelity to the complete predictor.</text>
   </g>
  </g>
