   <g id="text_1">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="11.338583" y="17.137773" transform="rotate(-0 11.338583 17.137773)">Table 12 | Requirements for extending the partial enclosure</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="14.838583" y="43.091489" transform="rotate(-0 14.838583 43.091489)">Complete predictor</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="108.38189" y="43.048833" transform="rotate(-0 108.38189 43.048833)">Route to a sound partial enclosure</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="292.633858" y="43.048833" transform="rotate(-0 292.633858 43.048833)">Additional requirement</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="14.838583" y="65.189536" transform="rotate(-0 14.838583 65.189536)">Random forest / extra trees</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 64.495552)">Bound each leaf's class-probability vector and average</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 74.017124)">tree bounds</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 64.495552)">Preserve probability averaging and the frozen temperature</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 73.364155)">transformation; a boosted-logit sum is not equivalent</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 95.395552)">XGBoost / LightGBM</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(14.838583 104.917124)">multiclass trees</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 95.636724)">Sum reachable-leaf bounds for each class score, then</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 104.917124)">bound the link</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 95.395552)">Validate intercepts, class/tree indexing, missing and categorical</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 104.262515)">splits, and libraries' exact output semantics</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="14.838583" y="126.252896" transform="rotate(-0 14.838583 126.252896)">Larger numerical trees</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 126.336567)">Use multiple mask words or another candidate-leaf</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 135.162515)">representation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 126.295552)">Charge extra update and interval-extraction work; the one-word</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 135.164155)">runtime does not transfer automatically</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="14.838583" y="157.889536" transform="rotate(-0 14.838583 157.889536)">RBF SVC</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 157.193911)">Enclose kernels and decision values under partial</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 166.75978)">features</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 157.195552)">Also enclose the fitted pairwise probabilities and multiclass coupling;</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 166.064155)">the present softmax score formula cannot simply replace native SVC</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 175.585728)">semantics</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="14.838583" y="198.198521" transform="rotate(-0 14.838583 198.198521)">Neural network</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 197.545552)">Propagate sound feature bounds to logits, then</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(108.38189 206.412515)">probabilities</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 197.545552)">Justify bounds for uncomputed signal features and control relaxation</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 206.414155)">cost; empirical training minima/maxima alone do not enclose unseen</text>
    <text style="font-size: 7px; font-family: 'Arial'; fill: #181818" transform="translate(292.633858 215.281118)">inputs</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.5px; font-family: 'Arial'; text-anchor: start; fill: #181818" x="11.338583" y="240.451472" transform="rotate(-0 11.338583 240.451472)">These routes are proposed extensions. Only numerical multiclass HGB trees with at most 63 leaves per tree were implemented and evaluated.</text>
   </g>
  </g>
 </g>
</svg>
